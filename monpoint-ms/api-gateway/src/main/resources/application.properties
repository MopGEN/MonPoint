spring.application.name=api-gateway
server.port=${SERVER_PORT:8080}

# =============================================================================
# Eureka Discovery Client (mismos valores que ms-auth)
# =============================================================================
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
# En Docker el hostname de un contenedor no lo resuelven los demas: se anuncia la IP.
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${spring.cloud.client.ip-address}:${server.port}
eureka.instance.lease-renewal-interval-in-seconds=10
eureka.instance.lease-expiration-duration-in-seconds=30
eureka.client.healthcheck.enabled=true
eureka.client.instance-info-replication-interval-seconds=10
# El Gateway, a diferencia de ms-auth, LEE el registro para saber a donde
# enrutar. Por omision lo refresca cada 30 s y LoadBalancer guarda la lista
# 35 s mas: un servicio recien levantado tardaria hasta un minuto en ser
# enrutable (mientras tanto, 503). Con 10 s y 10 s se acorta a ~20 s.
eureka.client.registry-fetch-interval-seconds=10
spring.cloud.loadbalancer.cache.ttl=10s

# =============================================================================
# Rutas (H-002)
# =============================================================================
# Spring Cloud Gateway 5.0 lee las rutas de spring.cloud.gateway.server.webflux.
# El prefijo antiguo spring.cloud.gateway.routes se ignora SIN dar error y el
# Gateway arrancaria sin rutas.
#
# - lb://<servicio> resuelve el nombre en Eureka y reparte entre instancias UP.
# - Sin StripPrefix: cada servicio expone su ruta completa (ms-auth atiende
#   /auth/login, no /login).
# - Solo existen estas rutas: cualquier otro prefijo responde 404.
# - Un servicio con ruta pero sin instancias en Eureka responde 503.
spring.cloud.gateway.server.webflux.routes[0].id=ms-auth
spring.cloud.gateway.server.webflux.routes[0].uri=lb://ms-auth
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/auth/**

spring.cloud.gateway.server.webflux.routes[1].id=ms-inventario
spring.cloud.gateway.server.webflux.routes[1].uri=lb://ms-inventario
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/inventario/**

spring.cloud.gateway.server.webflux.routes[2].id=ms-ventas
spring.cloud.gateway.server.webflux.routes[2].uri=lb://ms-ventas
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/ventas/**

spring.cloud.gateway.server.webflux.routes[3].id=ms-clientes
spring.cloud.gateway.server.webflux.routes[3].uri=lb://ms-clientes
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/clientes/**

spring.cloud.gateway.server.webflux.routes[4].id=ms-reportes
spring.cloud.gateway.server.webflux.routes[4].uri=lb://ms-reportes
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/reportes/**

spring.cloud.gateway.server.webflux.routes[5].id=ms-notificaciones
spring.cloud.gateway.server.webflux.routes[5].uri=lb://ms-notificaciones
spring.cloud.gateway.server.webflux.routes[5].predicates[0]=Path=/notificaciones/**

# =============================================================================
# JWT (H-003) — contrato en ms-auth/docs/CONTRATO_TOKEN.md
# =============================================================================
# Texto plano (UTF-8) de al menos 32 caracteres, IDENTICO al de ms-auth: ms-auth
# firma y el Gateway verifica. El valor por omision es el marcador de
# infra/.env.example, el mismo que usa ms-auth en local.
jwt.secret=${JWT_SECRET:cambiar_esta_clave_debe_tener_al_menos_32_caracteres}

# =============================================================================
# CORS (H-009)
# =============================================================================
# Origenes que el navegador puede usar para llamar a la API, separados por
# comas. En Docker llegan de CORS_ORIGENES (infra/.env).
monpoint.cors.origenes=${CORS_ORIGENES:http://localhost:5173}

# =============================================================================
# Actuator
# =============================================================================
# Solo /actuator/health, sin detalles: lo consultan Eureka y el healthcheck de
# Docker. No pasa por el filtro de JWT porque no es una ruta del Gateway.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

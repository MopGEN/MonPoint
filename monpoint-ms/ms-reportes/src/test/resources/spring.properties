# Spring Framework 7 "pausa" los contextos cacheados entre clases de prueba y, al reutilizarlos, llama start()
# en TODOS los beans con ciclo de vida, aunque tengan auto-startup=false. Eso arrancaba los listeners de RabbitMQ
# en las pruebas: con el broker apagado solo ensuciaba el log, pero con el broker encendido consumirían mensajes
# reales. Con NEVER los contextos cacheados no se pausan ni se reinician.
spring.test.context.cache.pause=never

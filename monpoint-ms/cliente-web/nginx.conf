server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Salud del servidor estático; no afirma que el Gateway esté disponible.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Vite nombra los assets con un hash. Un archivo inexistente debe dar 404,
    # nunca index.html con tipo de contenido incorrecto para un módulo JS.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Vue Router resuelve las subrutas incluso al entrar o recargar /caja.
    location / {
        try_files $uri $uri/ /index.html;
    }
}

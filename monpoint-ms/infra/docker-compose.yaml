services:
  mariadb-auth:
    image: mariadb:11.4
    container_name: monpoint-mariadb-auth
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-admin}
      MARIADB_DATABASE: monpoint_auth_db
    ports:
      - "3307:3306"   # host:contenedor. El 3306 del host lo ocupa MariaDB de Homebrew
    volumes:
      - mariadb_auth_data:/var/lib/mysql
      - ./mariadb-init:/docker-entrypoint-initdb.d:ro
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mariadb_auth_data:
  

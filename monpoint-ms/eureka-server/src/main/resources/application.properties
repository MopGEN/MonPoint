spring.application.name=eureka-server
server.port=${SERVER_PORT:8761}

# =============================================================================
# Modo standalone (un solo nodo)
# =============================================================================
# Eureka trae un cliente integrado pensado para clusters de varios servidores.
# Con un solo nodo no hay a quien registrarse ni de quien copiar el registro.
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false
# Configuracion standalone de la documentacion de Spring Cloud Netflix: defaultZone
# apunta al propio servidor. Eureka reconoce su propio host y no lo trata como una
# replica a la que copiar cada registro. Sin esto, la zona por omision
# (localhost:8761) se toma como otro nodo y Eureka intenta replicar hacia ella.
eureka.instance.hostname=localhost
eureka.client.service-url.defaultZone=http://${eureka.instance.hostname}:${server.port}/eureka/

# =============================================================================
# Expiracion de instancias caidas (H-001: "al detenerlo, su registro expira")
# =============================================================================
# La autopreservacion congela el registro cuando llegan menos latidos de los
# esperados, para no borrar servicios sanos durante un corte de red. Con pocas
# instancias, basta con que se caiga una para activarla, y entonces nada expira.
# En desarrollo y en Docker se desactiva; el panel muestra un aviso por ello.
eureka.server.enable-self-preservation=${EUREKA_SELF_PRESERVATION:false}
# Cada cuanto se barren las instancias vencidas (por omision 60 s).
eureka.server.eviction-interval-timer-in-ms=${EUREKA_EVICTION_INTERVAL_MS:5000}

# =============================================================================
# Actuator
# =============================================================================
# Solo /actuator/health, sin detalles: lo consulta el healthcheck de Docker.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

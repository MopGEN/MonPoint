spring.application.name=ms-notificaciones
server.port=${SERVER_PORT:8086}
# X-Request-ID en cada linea de log (lo pone RequestIdFilter en el MDC)
logging.pattern.level=%5p [%X{requestId:-}]
# API pura: una ruta inexistente responde 404 en ProblemDetail y no un 405
spring.web.resources.add-mappings=false
# MongoDB. Boot 4 lee spring.mongodb.uri (spring.data.mongodb.uri ya no se lee)
spring.mongodb.uri=${MONGO_URI:mongodb://notificaciones_user:notificaciones_pass@localhost:27017/notificaciones_db?replicaSet=rs0&authSource=notificaciones_db&directConnection=true}
spring.data.mongodb.auto-index-creation=true
# Eureka
#defaultZone	Es la dirección del servidor Eureka
#prefer-ip-address	Registra la IP en lugar del nombre del equipo, para que el Gateway pueda llegar
#instance-id	Da un nombre único a la instancia
#lease-renewal-interval	Avisa cada 10 s que sigue viva
#lease-expiration-duration	Pide a Eureka retirarla tras 30 s sin aviso
#healthcheck.enabled	Informa a Eureka la salud real, no solo que el proceso sigue vivo
#instance-info-replication-interval	Revisa cada 10 s si cambió su información y la envía a Eureka
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${spring.cloud.client.ip-address}:${server.port}
eureka.instance.lease-renewal-interval-in-seconds=10
eureka.instance.lease-expiration-duration-in-seconds=30
eureka.client.healthcheck.enabled=true
eureka.client.instance-info-replication-interval-seconds=10
# Actuator: solo /actuator/health, sin detalles internos
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
# RabbitMQ
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.username=${RABBITMQ_USER:monpoint}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:cambiar_esta_clave}

# Consumidores: al agotar los reintentos, el mensaje va a la cola de fallidos
spring.rabbitmq.listener.simple.default-requeue-rejected=false
spring.rabbitmq.listener.simple.retry.enabled=true
# Boot 4 usa max-retries: 2 reintentos + entrega inicial = 3 intentos totales.
spring.rabbitmq.listener.simple.retry.max-retries=2
spring.rabbitmq.listener.simple.retry.initial-interval=1s

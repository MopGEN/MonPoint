spring.application.name=ms-auth
server.port=${SERVER_PORT:8081}

# =============================================================================
# MongoDB Configuration (auth_db - Replica Set rs0)
# =============================================================================
spring.data.mongodb.uri=${MONGO_URI:mongodb://auth_user:auth_pass@localhost:27017/auth_db?replicaSet=rs0&authSource=auth_db&directConnection=true}
spring.data.mongodb.auto-index-creation=true

# =============================================================================
# Eureka Discovery Client
# =============================================================================
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${server.port}

# =============================================================================
# JWT Configuration (Clave compartida con API Gateway)
# =============================================================================
jwt.secret=${JWT_SECRET:dGhpcy1pcy1hLXNlY3JldC1rZXktZm9yLW1vbnBvaW50LWp3dC10b2tlbi0yNTYtYml0cw==}
jwt.expiration=${JWT_EXPIRATION_MS:86400000}

spring.application.name=ms-auth
server.port=${SERVER_PORT:8081}

# =============================================================================
# Logs: correlacion con el API Gateway (RNF-13)
# =============================================================================
# RequestIdFilter deja el X-Request-ID en el MDC y este patron lo imprime junto al
# nivel en cada linea de log de la peticion. Fuera de una peticion (p. ej. al
# arrancar) sale vacio: INFO [].
logging.pattern.level=%5p [%X{requestId:-}]

# =============================================================================
# Spring MVC
# =============================================================================
# ms-auth es una API y no sirve archivos estaticos. Sin esto, una ruta inexistente
# cae en el manejador de recursos estaticos: un GET da 404, pero un POST da 405.
# Asi, cualquier metodo sobre una ruta inexistente responde 404 en ProblemDetail.
spring.web.resources.add-mappings=false

# =============================================================================
# MongoDB Configuration (auth_db - Replica Set rs0)
# =============================================================================
# Spring Boot 4 movio la conexion a spring.mongodb.*: spring.data.mongodb.uri ya
# no se lee y la app caeria en silencio a mongodb://localhost/test.
spring.mongodb.uri=${MONGO_URI:mongodb://auth_user:auth_pass@localhost:27017/auth_db?replicaSet=rs0&authSource=auth_db&directConnection=true}
spring.data.mongodb.auto-index-creation=true

# =============================================================================
# Eureka Discovery Client
# =============================================================================
# Se registra como MS-AUTH; el Gateway lo encuentra con lb://ms-auth.
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
# En Docker el hostname de un contenedor no lo resuelven los demas: se anuncia la IP.
eureka.instance.prefer-ip-address=true
# La IP en el id evita que dos instancias en el mismo puerto (p. ej. una local y
# otra en Docker) se pisen el registro.
eureka.instance.instance-id=${spring.application.name}:${spring.cloud.client.ip-address}:${server.port}
# Latido cada 10 s; tras 30 s sin latidos, Eureka da la instancia por muerta.
eureka.instance.lease-renewal-interval-in-seconds=10
eureka.instance.lease-expiration-duration-in-seconds=30
# Reporta a Eureka la salud real (/actuator/health): si MongoDB cae, la instancia
# pasa a DOWN y el Gateway deja de enviarle trafico.
eureka.client.healthcheck.enabled=true
# Cada cuanto se reenvia a Eureka el estado de la instancia. Al arrancar se reporta
# DOWN un instante (la app aun no esta lista para recibir trafico); con los 30 s
# por omision tardaba medio minuto en volver a UP. Con 10 s va al ritmo del latido.
eureka.client.instance-info-replication-interval-seconds=10

# =============================================================================
# Actuator
# =============================================================================
# Solo se expone /actuator/health, publico y sin detalles internos: lo consultan
# Eureka y el healthcheck de Docker.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# =============================================================================
# JWT Configuration (Clave compartida con API Gateway)
# =============================================================================
# Texto plano (UTF-8) de al menos 32 caracteres: HS256 exige 256 bits y la app no
# arranca con una clave mas corta. Debe ser IDENTICA a la del API Gateway.
# El valor por omision es el mismo marcador de infra/.env.example, para que un
# ms-auth local y el Gateway en Docker coincidan sin configurar nada.
jwt.secret=${JWT_SECRET:cambiar_esta_clave_debe_tener_al_menos_32_caracteres}
jwt.expiration=${JWT_EXPIRATION_MS:86400000}

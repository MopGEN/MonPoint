# =============================================================================
# ms-ventas — Registro de ventas y saga de confirmacion
# =============================================================================
spring.application.name=ms-ventas
server.port=${SERVER_PORT:8083}

# X-Request-ID en cada linea de log (lo pone RequestIdFilter en el MDC)
logging.pattern.level=%5p [%X{requestId:-}]
# API pura: una ruta inexistente responde 404 en ProblemDetail y no un 405
spring.web.resources.add-mappings=false


# -----------------------------------------------------------------------------
# MongoDB
# -----------------------------------------------------------------------------
# Spring Boot 4 lee spring.mongodb.uri. La clave spring.data.mongodb.uri YA NO SE LEE,
# y sin aviso: la aplicacion caeria en silencio a mongodb://localhost/test.
#
# SIN VALOR POR OMISION, a proposito. ms-inventario y ms-clientes llevan la contrasena
# escrita aqui; ms-ventas no la lleva (RNF-06). Si MONGO_URI no esta definida, el
# servicio no arranca, que es preferible a arrancar contra una base equivocada o con
# una credencial publicada en el repositorio.
#
# Para desarrollo fuera de Docker, exportar la variable:
#   export MONGO_URI='mongodb://ventas_user:LA_CLAVE@localhost:27017/ventas_db?replicaSet=rs0&authSource=ventas_db&directConnection=true'
spring.mongodb.uri=${MONGO_URI}

# EXPLICITAMENTE DESACTIVADA, al contrario que en los otros tres servicios.
# Los indices de ms-ventas los crea infra/mongo-init/02-indices-ventas.js al aprovisionar
# la base, que es el mecanismo del Doc 04 §2: asi un @Indexed nuevo no se materializa solo
# y el esquema sigue cerrado. VerificadorDeIndices detiene el arranque si falta alguno.
spring.data.mongodb.auto-index-creation=false


# -----------------------------------------------------------------------------
# Eureka
# -----------------------------------------------------------------------------
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${spring.cloud.client.ip-address}:${server.port}
eureka.instance.lease-renewal-interval-in-seconds=10
eureka.instance.lease-expiration-duration-in-seconds=30
eureka.client.healthcheck.enabled=true
eureka.client.instance-info-replication-interval-seconds=10


# -----------------------------------------------------------------------------
# Actuator
# -----------------------------------------------------------------------------
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never


# -----------------------------------------------------------------------------
# RabbitMQ
# -----------------------------------------------------------------------------
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.username=${RABBITMQ_USER:monpoint}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:cambiar_esta_clave}

# CONFIRMACIONES DE PUBLICACION. Sin estas dos lineas, send() retorna cuando el mensaje
# se entrego al canal, no cuando el broker lo acepto: un mensaje con una routing key sin
# enlace se descarta en el broker sin lanzar excepcion y la bitacora registraria una
# publicacion que nunca ocurrio. Sin outbox (recortado, Doc 01 §7.4), la bitacora es la
# unica red de seguridad de la saga: no puede mentir.
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true

# Consumidores (RNF-17): al agotar los reintentos, el mensaje rechazado va a la cola de
# fallidos declarada en RabbitConfig. Mismos valores que ms-inventario, a proposito: una
# saga con dos lados reintentando a ritmos distintos es muy dificil de depurar.
spring.rabbitmq.listener.simple.default-requeue-rejected=false
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.initial-interval=1s
